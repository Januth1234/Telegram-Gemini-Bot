<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; font-family: -apple-system, sans-serif; margin: 0; background: #0f172a; color: white; }
  .header { background: linear-gradient(135deg, #6366f1, #8b5cf6); padding: 16px; }
  .logo { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }
  .sub { font-size: 10px; opacity: 0.8; margin-top: 2px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  .body { padding: 16px; }
  .status { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.05); margin-bottom: 12px; font-size: 12px; font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; flex-shrink: 0; box-shadow: 0 0 6px #10b981; }
  .dot.inactive { background: #6b7280; box-shadow: none; }
  .btn { display: block; width: 100%; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
  .btn-primary { background: #6366f1; color: white; }
  .btn-secondary { background: rgba(255,255,255,0.08); color: white; }
  .btn:hover { opacity: 0.85; }
  .info { font-size: 10px; color: #64748b; line-height: 1.5; }
  .tab-info { font-size: 10px; color: #94a3b8; padding: 6px 8px; background: rgba(255,255,255,0.03); border-radius: 6px; margin-bottom: 8px; word-break: break-all; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">🤖 Orin AI Agent</div>
  <div class="sub">Browser Automation</div>
</div>
<div class="body">
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="status-text">Ready to connect</span>
  </div>
  <div class="tab-info" id="tab-info">No tab selected</div>
  <button class="btn btn-primary" id="open-orin">Open Orin AI</button>
  <button class="btn btn-secondary" id="set-tab">Set Active Tab as Target</button>
  <div class="info">
    Once connected, Orin AI can click, type, navigate, and take screenshots in any browser tab — all under your supervision.
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
